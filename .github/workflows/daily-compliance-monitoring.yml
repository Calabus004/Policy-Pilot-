name: Daily Compliance Monitoring

on:
  schedule:
    # Runs every day at 06:00 UTC = 07:00 BST (British Summer Time,
    # late Mar - late Oct). Cron on GitHub Actions is always fixed UTC and
    # does NOT shift with the clocks, so once BST ends and the UK reverts
    # to GMT (UTC+0), this will fire at 6am UK time instead of 7am until
    # this line is manually changed back to "0 7 * * *" for the winter.
    # (A DST-proof year-round version is possible with two cron entries
    # plus a month-range guard on the job, but isn't set up here.)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # adds a "Run workflow" button in the Actions tab for manual runs

jobs:
  run-compliance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily compliance monitoring script
        env:
          # Forces stdout/stderr to be unbuffered so log lines appear in the
          # true order they were printed — without this, Python fully
          # buffers stdout when it isn't a terminal (as in CI), so an error
          # printed to stderr at the very end can appear to jump above
          # earlier "Step X/6" lines that just hadn't flushed yet.
          PYTHONUNBUFFERED: "1"
          OPENSANCTIONS_API_KEY: ${{ secrets.OPENSANCTIONS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          INTERNAL_ALERT_WEBHOOK_URL: ${{ secrets.INTERNAL_ALERT_WEBHOOK_URL }}
        run: python -m compliance_monitor.main
