<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're on the list — Policy Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #0f141c;
    --panel: #171e29;
    --line: #2a3444;
    --text: #e4e9f1;
    --text-dim: #8a94a6;
    --amber: #e2a33f;
    --amber-dim: #a97a34;
    --green: #6fae82;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    text-align: center;
    padding: 24px;
  }
  .card {
    position: relative;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 40px 32px;
  }
  .card::before, .card::after, .card .bl, .card .br {
    content: "";
    position: absolute;
    width: 16px; height: 16px;
    border-color: var(--amber-dim);
    border-style: solid;
  }
  .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .card::after { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .card .bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .card .br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 0.74rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--green);
    border: 1px solid var(--line);
    padding: 6px 12px;
    margin-bottom: 20px;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 12px; text-wrap: balance; }
  h1 span { color: var(--amber); }
  p { color: var(--text-dim); margin: 0 0 26px; font-size: 0.94rem; }
  a.back {
    display: inline-block;
    color: #1a1206;
    background: var(--amber);
    padding: 12px 22px;
    text-decoration: none;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="bl"></span><span class="br"></span>
    <div class="status"><span class="status-dot"></span> Entry filed</div>
    <h1>You're on the <span>Policy Pilot</span> waitlist</h1>
    <p>Thanks for signing up — we'll email you as soon as we're ready to bring you on board.</p>
    <a class="back" href="/">Back to homepage</a>
  </div>
</body>
</html>
