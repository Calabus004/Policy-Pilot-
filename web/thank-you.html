<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're on the list — Policy Pilot</title>
<style>
  :root {
    --bg: #0b1120;
    --card: #151f38;
    --border: #232f4d;
    --text: #e8ecf7;
    --text-dim: #9aa4c0;
    --accent: #5b8cff;
    --accent-2: #7fe6c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% -10%, #1b2a4a 0%, var(--bg) 45%) fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .icon { font-size: 2.4rem; margin-bottom: 12px; }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 12px;
  }
  h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { color: var(--text-dim); margin: 0 0 24px; }
  a.back {
    display: inline-block;
    color: var(--text);
    background: linear-gradient(135deg, var(--accent), #4f6fe0);
    padding: 12px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>You're on the <span>Policy Pilot</span> waitlist</h1>
    <p>Thanks for signing up — we'll email you as soon as we're ready to bring you on board.</p>
    <a class="back" href="/">Back to homepage</a>
  </div>
</body>
</html>
